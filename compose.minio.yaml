# 本机联调 MinIO（不作为团队共享数据源）。用法：
#   docker compose -f compose.minio.yaml up -d
#   控制台 http://127.0.0.1:9001  默认账号/密码见下方环境变量
#   在控制台创建桶 glucopilot（或与 MINIO_BUCKET 一致）后，.env 设 STORAGE_PROVIDER=minio
name: glucopilot-minio
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
volumes:
  minio-data:
