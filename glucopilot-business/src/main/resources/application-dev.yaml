# 开发环境差异项（profile=dev）。
# 启动：--spring.profiles.active=dev,local（local 放个人密钥，见 application-local.yaml）
# 之所以不写在 application.yaml 根文档里：spring.config.activate.on-profile 放在根文档会让
# **整个文件**都变成 dev 专属，不带 profile 启动会直接因缺少 datasource 而失败。
spring:
  config:
    # 私密环境配置只保存在忽略的 .env，兼容 backend、项目根目录和外层 IDE 工作区。
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:GlucoPilot/.env[.properties]
  flyway:
    # 开发库常被手工改过结构：已有表但无 flyway_schema_history 时自动 baseline，避免重复建表/插种子。
    # 生产不要开这个开关，否则会静默跳过建表与种子。
    baseline-on-migrate: false
    baseline-version: 3

logging:
  level:
    com.threadfit.glucopilot: INFO
    com.threadfit.glucopilot.ai: DEBUG
    # 单独压掉 Mapper 日志：MyBatis 的 DEBUG 会把 SQL 参数（含用户对话原文、健康数据）整条打进日志。
    # 排查 SQL 时临时调到 DEBUG 即可，不要长期打开。
    com.threadfit.glucopilot.ai.business.chat.mapper: INFO

# ---------------------------------------------------------------------------
# 对象存储（dev = 后端自带的本地文件存储）。完整入库流程仍走：凭证 → PUT → 登记 → 去重，
# 但无需开发者额外安装 MinIO；生产仍走阿里云 OSS，见 application-prod.yaml。
# ---------------------------------------------------------------------------
glucopilot:
  storage:
    provider: local
    local-dir: ${LOCAL_UPLOAD_DIR:./data/uploads}

# ---------------------------------------------------------------------------
# 微信登录（dev 只有 Mock 实现，没有真实 jscode2session）：
#   留空 = 按 wx.login() 给的 code 哈希派生 openid —— 开发者工具每次登录的 code 都不同，
#          于是"每次登录都是一个新用户"：每次都要重新同意免责声明、会话与血糖记录攒不到一起，
#          而 app.js 的 onShow 免责校验会把页面强制拉回声明页，看起来像"AI 对话页打不开"。
#   填值 = 恒定返回该 openid，登录一次之后一直是同一个开发用户（推荐本机联调使用）。
# 本机填值请写在 application-local.yaml（已 gitignore），不要提交个人 openid。
# 需要联调"新用户/首登/免责声明"流程时，清空本项并重启。
# ---------------------------------------------------------------------------
wechat:
  mock:
    fixed-openid: ${WECHAT_MOCK_FIXED_OPENID:}
