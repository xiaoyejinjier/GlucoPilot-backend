# 通用配置（任意 profile 都生效）。
# profile 约定：
#   application.yaml        公共配置 + 本机默认可跑通的默认值
#   application-dev.yaml    开发环境差异（profile=dev）
#   application-local.yaml  个人密钥/口令，已 gitignore，禁止入库（profile=local）
# 没显式指定 profile 时（IDE 直接 Run、java -jar 不带参数）默认激活 dev,local；
# 生产用 --spring.profiles.active=prod 显式覆盖即可。
#
# ⚠️ 「开箱即用」有一个前提：token.secret 引用的 ${OPS_TOKEN_SECRET} 没有默认值，
#    缺了它连本地都起不来（PlaceholderResolutionException）。dev profile显式导入.env，
#    IDE工作目录应为本后端根目录；也可注入环境变量或写application-local.yaml。
#    其他profile由部署环境提供私密配置，见README.md。
wechat:
  login:
    mode: ${WECHAT_LOGIN_MODE:auto}
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}

spring:
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_SMTP_TIMEOUT:8000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:8000}
          quitwait: false
          ssl:
            enable: ${MAIL_SSL_ENABLED:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:true}
            required: ${MAIL_STARTTLS_REQUIRED:true}
  application:
    name: GlucoPilot Backend
  messages:
    basename: i18n/messages
  profiles:
    default: dev,local

  datasource:
    # 开发、测试和生产均连接团队统一部署的 MySQL；禁止在代码中写入服务器地址或密码。
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:sugar_health}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=${DB_SSL_ENABLED:false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      # Redis 必须由远程环境部署；本服务只通过环境变量连接，不在 compose 中创建临时数据容器。
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: ${REDIS_TIMEOUT:3s}

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 空库按顺序执行所有迁移；存量库必须确认历史版本，禁止自动猜测 baseline。
    baseline-on-migrate: false
    baseline-version: 3
  mvc:
    async:
      # SSE 流式补全（接口 2.25）的异步请求超时。
      # 2.25 改为返回 Flux 之后，超时不再由代码里的 new SseEmitter(timeout) 决定，而是走这个属性；
      # 不配置则落到容器默认值（Tomcat 通常 30s），等于把原来的 60s 悄悄改小。
      request-timeout: 60s
  ai:
    # 协议统一（2026-11）之后不再有 spring.ai.deepseek.*：
    # 文本与视觉都走 OpenAiChatModel（DeepSeek 官方端点本身就是 OpenAI 兼容的）。
    # 模型行来自数据库（ai_model_config），连接参数与凭据来自下面的 ai.channels.*，
    # 因此这里只需要保留「工具调用护栏」这类与 provider 无关的框架行为。
    tools:
      limits:
        # 工具调用护栏：超过上限直接抛异常，避免模型陷入反复调用的死循环（当前未注册工具，先立好规矩）
        max-total-tool-calls: 8
        on-limit-exceeded: throw

server:
  port: 8080

# MyBatis-Plus：逻辑删除与下划线映射
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.threadfit.glucopilot: INFO
    com.baomidou.mybatisplus: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info


# ---------------------------------------------------------------------------
# AI 模块业务编排（前缀 ai）
# 与 spring.ai.* 的分工：spring.ai.* 管 provider 与框架行为；ai.* 管本项目的
# 场景 → 提示词/参数、记忆窗口、医疗安全词、工具白名单。
#
# 场景是 AI 模块的组织单位（见 SceneCode）：对话 / 对话内图片 / 饮食分析 / 血糖识别。
# 场景里 temperature、max-tokens、thinking 都是**可选覆盖**，
# 不写就继承模型行（ai_model_config）上的值。
# ---------------------------------------------------------------------------
ai:
  # 会话生命周期（接口 5.3 列表 / 5.4 删除 / 2.23 新建）
  chat:
    # 惰性归档阈值（天）：拉列表时把"进行中但太久没消息"的会话置为 0 归档，0 = 关闭。
    # 归档后该用户下次 /current 会新建会话，而不是接着老会话说话。
    archive-idle-days: 30
    # 会话列表每页上限，防止前端传超大 pageSize
    max-page-size: 50

  # 会话记忆窗口：送入模型的最近原文消息条数。
  # 注意：chat_session.window_msg_count 这一列已在 V21 标注废弃——读取侧只认这里的配置，
  # 不读那个列（避免出现"看起来能按会话调窗口、实际不生效"的误导）。
  #
  # ② 期（2026-10-16）起改为**按 token 预算**裁剪：
  #   实测一轮几乎空的对话（系统提示词 1651 字 + 6 个工具定义）就已经 5012 prompt tokens，
  #   而单条助手回复上限 20000 字、回放时不做逐条截断——"20 条"能装的内容量可以差两个数量级。
  memory:
    # 主判据：一轮 prompt 允许的总 token（含系统提示词与工具定义）。它是安全阀不是目标值。
    # 2026-11-19 从 4096 提到 16000：实测固定开销（CHAT v4 提示词 + 13 个工具定义）就已 5444~6700 token，
    # 4096 比固定开销还小 ⇒ `used + cost <= budget` 永远为假，真正生效的只有 keep-recent-messages=6，
    # 日志里一直在打「超预算：保底条数优先」。按 DeepSeek 实测价（命中 $0.022/M vs 未命中 $0.66/M，1:30）
    # 多送历史几乎全是**命中**部分，成本增量很小，却能换来 3 倍原文窗口。
    max-prompt-tokens: 16000
    # 无论预算多紧都至少保留这么多条最近历史（保连贯性，宁可超一点预算）
    keep-recent-messages: 6
    # 条数上限（降级为兜底：与 token 预算取小，防估算器被极短消息带偏后一次塞进几百条）
    window-messages: 20
    # 仓库一次最多捞多少条可回放消息（防御性上限）
    max-fetch: 200
    # 滚动摘要：长度上限、单次输入上限（字符）与输出 token 上限
    summary-max-chars: 800
    # 输入上限从 6000 降到 3000 是实测结论：6000 字摘要在该通道上会读超时（ReadTimeoutException），
    # 任务失败 → 摘要一直建不起来；摘要对"少一点原文"并不敏感
    summary-input-max-chars: 3000
    # 摘要正文只有几百字，封顶可杜绝"模型长篇发挥"拖长生成时间
    summary-max-tokens: 600
    # 攒够再压：候选（窗口外且未被摘要覆盖的消息）满足「12 条」或「1500 字」才跑一次摘要；
    # 另加 60 秒最小间隔（<=0 关闭）。两条不设门的话，每轮新增 2 条消息、保底只留 6 条，
    # 从第 4 轮起每轮都会触发——摘要调用本身不便宜，它还会把摘要块反复重写、
    # 连带废掉后面整段历史的前缀缓存（实测：摘要重写那轮命中 24%，下一轮 93%）
    summary-min-pending-messages: 12
    summary-min-pending-chars: 1500
    summary-min-interval-seconds: 60
    # 工具结果回放（B3 后半）：是否把最近工具调用的结果摘要注入上下文，以及条数/字符上限
    tool-replay-enabled: true
    tool-replay-max-items: 3
    tool-digest-max-chars: 512
    # 记忆抽取改走结构化输出：由 BeanOutputConverter 生成 JSON Schema 并由
    # StructuredOutputValidationAdvisor 校验/重试，避免模型在 JSON 外夹解释文字。
    # 代码默认 false（单测里 mock 的客户端只桩了 content()），部署时在此打开。
    structured-output: true
    # 记忆抽取的窗口化：每个窗口看多少条、一次最多回溯几个窗口（回看上限 = 40 × 2 = 80 条）。
    # 不一次性把整段会话丢给模型，是因为输入有字符上限（memory-extract-input-max-chars），
    # 长会话会被截到只剩最近几轮；窗口化让靠前的对话也有机会进模型视野。
    # 顺序为老窗先、新窗后：两个窗口提到同一个键时，后写的新说法才留得下来。
    memory-extract-window-messages: 40
    memory-extract-max-windows: 2
    # 关键词兜底：没有 tool calling 的部署才打开。打开后用「记住/记一下/别忘了」等词猜意图，
    # 窗口收窄到 keyword-fallback-window-messages 条——它是聊天主链路顺带触发的，
    # 不能像终局复盘那样一次回看 80 条。
    keyword-trigger-fallback: false
    keyword-fallback-window-messages: 6
    # 删除后的冷却天数：用户在记忆页删掉某个键之后，自动抽取（会话结束/归档补齐）
    # 在这段时间内不许把这个键重新插回来，否则就是"删了又回来"。
    # 只拦自动抽取；用户当轮亲口说的（save_long_term_memory 工具）不受影响。0 = 关闭。
    deleted-key-cooldown-days: 30

  # AI 并发闸门：多实例共享的「互斥 / 限速 / 去重合并 / 定时任务独占」。
  #
  # backend 有两个值：
  #   redisson（默认）—— 用 Redis 原语，多实例真正互斥；
  #   memory         —— 只用进程内实现，供单测与没有 Redis 的环境。
  # 连不上 Redis 时不会整体报错：degrade-on-redis-error=true 会退回进程内实现并打 WARN
  # （代价是退化成单实例语义，但绝不把"Redis 抖动"升级成"用户发不了消息"）。
  #
  # ⚠️ 改速率阈值必须删对应的 Redis 键：RRateLimiter.trySetRate 只在键不存在时生效，
  #    把 chat-per-minute 从 20 调到 30 之后老键仍按 20 走。相关键：ai:rate:*、ai:quota:*。
  concurrency:
    backend: redisson
    degrade-on-redis-error: true
    # 单条助手消息的生成权租约：正常一轮 60 秒内结束，给 90 秒留余量；
    # 过期即视为持有者已死（进程被 kill 时靠它自愈）。
    round-lease-seconds: 90
    # 每用户同时进行的流式对话上限：一个人开太多 SSE 会长期占用线程与连接。
    stream-permits-per-user: 2
    stream-lease-seconds: 90
    # 集群同时生成上限：单实例并发太高时一起打上游会触发限流，宁可排队失败也别整体超时。
    cluster-round-permits: 64
    # 每分钟问答次数与每日问答轮数：both 429，区分"手太快"和"今天用完了"。
    chat-per-minute: 20
    daily-chat-turns: 200
    # 语音识别：全局 8 路（上游 ASR 并发有限）+ 每人 1 路，识别长音频时租约要够长。
    speech-cluster-permits: 8
    speech-lease-seconds: 180
    # 后台任务的合并标记与独占租约时长：摘要/抽取跑完会主动清标记，这里只是"进程猝死"的兜底。
    job-dedup-seconds: 600
    # 工具结果缓存：同一会话同一工具同一入参在多长时间内复用。
    tool-cache-minutes: 30
    tool-cache-max-entries: 16

  # 医疗安全硬拦截：命中敏感词的请求不会发给模型，直接返回固定话术。
  # 提示词里的合规约束是软约束（模型可能不遵守），这里是硬约束。
  # 词表保持聚焦：不要放单字「药」，否则「二甲双胍能吃吗」这类正常科普问题也会被拦掉。
  guard:
    enabled: true
    sensitive-words:
      - 吃几片
      - 吃几粒
      - 剂量
      - 加量
      - 减量
      - 停药
      - 换药
      - 开药
      - 胰岛素用量
      - 调整用药
    # failure-response 留空则使用代码内置话术（引导就医 + 免责声明）

  # 工具白名单：只注册显式登记的工具，绝不做包扫描（见 AiToolRegistry / AiToolConfig）。
  # 名字必须与 @Tool(name=...) 完全一致；配了名字却没有对应 Bean 会在启动时 WARN。
  # 需要临时关闭全部工具时把 allow-list 置空即可（allow-list: []）。
  # ⚠️ 工具越多，模型选择越容易出错：新增前先想清楚能不能并进已有工具的返回里。
  tools:
    allow-list:
      - query_glucose_range
      - get_health_profile
      - get_daily_checkin
      - get_month_stats
      - query_meal_records
      - lookup_food_nutrition
      # 第二批（2026-11）：会话自省 + 血糖聚合 + 提醒 + 社区检索，全部只读、返回有上限。
      # get_session_state / search_chat_history 让模型不必重复查同一件事；
      # search_community_articles 依赖社区侧实现（ArticleSearchQuery），过滤规则与列表页一致。
      - query_glucose_stats
      - search_chat_history
      - get_session_state
      - list_reminders
      - search_community_articles
      # 第三批（2026-11）：唯一的写工具——让模型自己判断「这句话该不该记成长期事实」，
      # 取代纯关键词判定（「我最近不能吃辣了」不含「记住」，却必须记住）。
      # 它写的是记忆而非业务单据：可撤销、有界（5 类 × 每类多条、单条 200 字），
      # 冲突策略见 UserChatMemoryService.WriteSource（EXPLICIT 覆盖、BATCH 只升不降）。
      - save_long_term_memory
      # 读工具：每轮注入的长期记忆只有最可信的十几条，用户问「你还记得我什么」时
      # 模型需要能主动去查（否则第 N 名以后的事实在它眼里不存在）。
      # 按类/关键词收窄、无分页游标；不带它也能跑，只是模型会更容易说"我不记得"。
      - list_long_term_memory

  # ---------------------------------------------------------------------------
  # 提示词后台化（接口 4.11~4.13）：后台改提示词时执行的**阻断式**校验参数。
  # 提示词正文与版本在 ai_prompt_template 表；classpath 的 prompts/**/*.md 只在
  # "库里没有启用版本"或"库表那一版校验不通过"时兜底（行为与引入后台前一致）。
  # ---------------------------------------------------------------------------
  prompt:
    # 正文长度下限（字符）：误清空/误粘贴成一句话时直接拒绝保存
    min-length: 50
    # 需要安全关键词校验的场景（configKey）：对话场景面向用户，必须留专业就医指引
    safety-scenes:
      - chat
    # 必含安全关键词（命中任意一个即可），仅对 safety-scenes 生效
    safety-keywords:
      - 就医
      - 医院
      - 医生
      - 诊断

  # ---------------------------------------------------------------------------
  # 视觉（多模态）provider：阿里云百炼 qwen-vl，走 OpenAI 兼容协议（接口 2.24 msgType=2）。
  # enabled=false 时视觉场景继续抛业务异常，**绝不回落到文本模型**。
  # 凭据只放 application-local.yaml（已 gitignore）或环境变量，禁止写进本文件。
  # 注意：这里不是 spring.ai.openai.* —— 本模块刻意不引该 starter，
  # 写在那里不会有任何自动装配去读（详见 AIProperties.VisionProperties 注释）。
  # ---------------------------------------------------------------------------
  # 短语音转文字：仅返回待确认草稿，不自动发送聊天消息。
  # api-key 缺省时在服务内复用 ai.vision.api-key；密钥只放环境变量或本地配置。
  speech:
    enabled: true
    api-key: ${AI_SPEECH_API_KEY:}
    base-url: ${AI_SPEECH_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${AI_SPEECH_MODEL:qwen3-asr-flash}

  vision:
    # 刻意写字面量 false，不写成 ${AI_VISION_ENABLED:false}：
    # 类型化属性（boolean / int）拿到未解析的 ${...} 字面量会直接绑定失败，
    # 而 AiPropertiesBindingTest 用的正是「不解析占位符」的原始 YAML 加载器。
    # 需要开启时用环境变量 AI_VISION_ENABLED=true —— 环境变量优先级高于本文件，
    # 由 relaxed binding 映射到 ai.vision.enabled，@ConditionalOnProperty 也读得到。
    enabled: false
    base-url: ${AI_VISION_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${AI_VISION_API_KEY:}
    model: ${AI_VISION_MODEL:qwen3-vl-plus}
    max-tokens: 512
    temperature: 0.2
    # 单张图片原始字节上限（5MB）：超限直接拒绝，避免把超大图塞进 base64 请求
    max-image-bytes: 5242880
    timeout-seconds: 60

  # 视觉通道的「模型」不再在这里单独配一个 ai.meal.model：饮食分析与其它视觉场景共用
  # 同一个视觉通道模型（后端可在「模型配置」里给视觉模型标默认，或在「场景配置」里给
  # 某个场景绑定别的视觉模型）。原 ai.meal.model 与 ai.vision.model 是同一份东西写了两遍，
  # 改一个忘一个就会出现「配置说 A、实际调 B」。

  # 通道级配置的统一视图：业务代码只读这一份（AiChannelProperties），两个通道形状完全相同。
  # 协议统一（S3）之后不再有 spring.ai.deepseek.*：文本通道和视觉通道一样，直接读环境变量。
  # 注意这里是**兜底**：真正生效的模型行来自数据库（ai_model_config），本段只在库里没有
  # 可用行时提供通道默认凭据与模型名。
  # 超时只作用于非流式调用（连通性测试、审核、摘要、记忆抽取）；SSE 流式不设读超时。
  channels:
    text:
      # DeepSeek 官方端点本身就是 OpenAI 兼容的，协议统一后与视觉通道共用 OpenAiChatModel。
      base-url: ${AI_TEXT_BASE_URL:https://api.deepseek.com}
      # 兼容历史配置：仍然认 AI_DEEPSEEK_API_KEY 与 application-local.yaml 里的 deepseek.apiKey。
      api-key: ${AI_DEEPSEEK_API_KEY:${deepseek.apiKey:}}
      model: ${AI_TEXT_MODEL:deepseek-v4-flash}
      temperature: ${AI_TEXT_TEMPERATURE:}
      max-tokens: ${AI_TEXT_MAX_TOKENS:}
      timeout-seconds: ${AI_TEXT_TIMEOUT_SECONDS:60}
    vision:
      base-url: ${ai.vision.base-url:}
      api-key: ${ai.vision.api-key:}
      model: ${ai.vision.model:}
      temperature: ${ai.vision.temperature:}
      max-tokens: ${ai.vision.max-tokens:}
      timeout-seconds: ${ai.vision.timeout-seconds:60}

  scenes:
    # 纯文本对话（接口 2.23 / 2.24 / 2.25）：当前唯一已实现的场景
    chat:
      prompt: prompts/chat/system.md
      version: v1

    # 对话内发图片（接口 2.24 msgType=2）的**阶段 1**：视觉模型看图，产出一段客观描述。
    # 阶段 2（组织回答）复用下面的 chat 场景——它本质就是一次普通对话，因此本场景
    # 只持有「看图描述」这一份提示词，不需要第二阶段的提示词，SceneCode 也无须新增场景。
    # 提示词刻意要求「只描述、不回答」：它的产物是中间产物，既进阶段 2 的上下文，
    # 也会回填 chat_message.media_caption 进入会话记忆。
    chat-image:
      prompt: prompts/chat-image/analyze.md
      version: v1

    # 饮食分析 / 拍照估糖（接口 2.20）：需要视觉模型；估算营养与血糖影响属于推理任务。
    # 注意：这里**不能**写 thinking —— 视觉通道走 OpenAI 兼容协议，没有这个入参，
    # 写了也不会发出去（启动时 SceneModelResolver.warnAboutIgnoredVisionThinking 会告警）。
    meal-analysis:
      prompt: prompts/meal-analysis/system.md
      version: v1
      variables:
        - foodText
      temperature: 0.2

    # 血糖仪读数识别（接口 2.21 / 2.22）：需要视觉模型；要求稳定不发挥，温度取低
    ocr-glucose:
      prompt: prompts/ocr-glucose/system.md
      version: v1
      temperature: 0

    # 会话滚动摘要（② 期）：把超出记忆窗口的旧对话压缩成事实摘要（产物是内部上下文，不给用户看）。
    # 温度取低：它要稳定复述而不是发挥；模型可单独在后台绑一个更便宜的（ai_scene_config）。
    summary:
      prompt: prompts/summary/compress.md
      version: v1
      temperature: 0.1

    # 长期记忆抽取（③ 期）：从对话里挑出值得跨会话记住的用户事实，输出 JSON（不给用户看）。
    # 温度取低：要稳定抽取而不是发挥；模型可在后台单独绑一个更便宜的。
    memory:
      prompt: prompts/memory/extract.md
      version: v1
      temperature: 0.1

    # 社区内容审核（社区 AI 审核一期）：文章初审与评论审核，输出判定 + 类别 + 严重度。
    # 温度取 0：判定要稳定；模型可在后台单独绑一个更便宜更快的（分类任务不需要推理大模型）。
    # 提示词正文**禁止出现花括号/方括号**（ST 模板会当成变量表达式，V22/V23/V27 三次教训），
    # 输出格式因此用「字段清单」描述。
    moderation:
      prompt: prompts/moderation/system.md
      version: v1
      temperature: 0
      # 审核结论只有几行字，封顶可杜绝"模型长篇发挥"拖延时延与成本
      max-tokens: 300
      # 关掉思维链：分类任务不需要推理链，开了只会让首 token 更慢（摘要场景已踩过读超时）
      thinking: false

    # 中英翻译（社区内容英文版 / 昵称英文化）：把一批「键 → 中文」翻成英文。
    # 温度取 0：翻译要忠实原文，任何"润色发挥"都会让数字/单位核对失败。
    # json: 本场景必须开——产物是键集合由调用方给定的扁平 JSON 字典，不开会带回 ```json 围栏。
    # 提示词同样禁止花括号/方括号（正文在 ai_prompt_template 的 TRANSLATION 场景，V54 播种）。
    translation:
      prompt: prompts/translation/system.md
      version: v1
      temperature: 0
      # 一批最多 24 段、总长 ≤3200 字，6000 给足 JSON 键名与英文字数膨胀的余量
      max-tokens: 6000
      thinking: false
      json: true


glucopilot:
  mail:
    from: ${MAIL_FROM:}

# 食品读缓存复用spring.data.redis；版本在MySQL事务中更新，Redis故障自动回源。
food:
  catalog-cache:
    enabled: ${FOOD_CACHE_ENABLED:true}
    ttl: ${FOOD_CACHE_TTL:10m}
    key-prefix: ${FOOD_CACHE_KEY_PREFIX:glucopilot:food:v1}

# 账号注销异步清理 worker（方案 §6.4）
# enabled=false 时不做任何清理：只影响后台执行，C 端提交注销仍然生效并立即失效会话
# 注意：worker 没有分布式锁，仅支持单实例部署；多实例会重复执行 purge
account:
  cancellation:
    enabled: ${ACCOUNT_CANCELLATION_ENABLED:true}
    initial-delay: ${ACCOUNT_CANCELLATION_INITIAL_DELAY:20000}
    poll-delay: ${ACCOUNT_CANCELLATION_POLL_DELAY:30000}
    # 恢复期结束后再等多久才清理：保证没有在途的恢复请求
    safety-margin: ${ACCOUNT_CANCELLATION_SAFETY_MARGIN:5m}
    # 声明部署形态：true=单实例（当前唯一支持形态）；改成多实例前必须先加分布式锁
    single-instance: ${ACCOUNT_CANCELLATION_SINGLE_INSTANCE:true}

# Official RuoYi framework settings; secrets supplied by deployment environment.
ruoyi:
  name: GlucoPilot
  version: 3.9.2
  copyrightYear: 2026
  profile: ${RUOYI_UPLOAD_PATH:/app/uploads}
  addressEnabled: false
  captchaType: math
user:
  password:
    maxRetryCount: 5
    lockTime: 10
token:
  header: Authorization
  secret: ${OPS_TOKEN_SECRET}
  expireTime: 480
mybatis:
  typeAliasesPackage: com.ruoyi.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml
xss:
  enabled: false
  excludes: /admin/v1/ruoyi/notices
  urlPatterns: /admin/v1/*
referer:
  enabled: false
  allowed-domains: localhost
gen:
  author: GlucoPilot
  packageName: com.threadfit.glucopilot.generated
  autoRemovePre: false
  tablePrefix: gp_
  allowOverwrite: false

# 独立的支付宝沙箱，默认关闭；全部取自环境变量，不填写真实密钥。
payments:
  alipay:
    sandbox:
      enabled: ${ALIPAY_SANDBOX_ENABLED:false}
      app-id: ${ALIPAY_SANDBOX_APP_ID:}
      private-key: ${ALIPAY_SANDBOX_PRIVATE_KEY:}
      public-key: ${ALIPAY_SANDBOX_PUBLIC_KEY:}
      seller-id: ${ALIPAY_SANDBOX_SELLER_ID:}
      notify-url: ${ALIPAY_SANDBOX_NOTIFY_URL:}
      transfer-scene-name: ${ALIPAY_SANDBOX_TRANSFER_SCENE_NAME:业务结算}
      transfer-scene-info-type: ${ALIPAY_SANDBOX_TRANSFER_SCENE_INFO_TYPE:结算款项名称}

# 厂商云拉取（首期华为）。密钥与开关仅来自环境变量，禁止写入真实值到仓库。
device:
  cloud:
    token-aes-key: ${DEVICE_CLOUD_TOKEN_AES_KEY:}
    pull-min-interval-seconds: ${DEVICE_CLOUD_PULL_MIN_INTERVAL_SECONDS:60}
    huawei:
      enabled: ${HUAWEI_CLOUD_ENABLED:false}
      client-id: ${HUAWEI_HEALTH_CLIENT_ID:}
      client-secret: ${HUAWEI_HEALTH_CLIENT_SECRET:}
      redirect-uri: ${HUAWEI_HEALTH_REDIRECT_URI:}
      authorize-base: ${HUAWEI_HEALTH_AUTHORIZE_BASE:https://oauth-login.cloud.huawei.com/oauth2/v3/authorize}
      token-url: ${HUAWEI_HEALTH_TOKEN_URL:https://oauth-login.cloud.huawei.com/oauth2/v3/token}
      api-base: ${HUAWEI_HEALTH_API_BASE:https://health-api.cloud.huawei.com/healthkit/v2}
      scopes: ${HUAWEI_HEALTH_SCOPES:openid https://www.huawei.com/healthkit/bloodglucose.read}
      return-url: ${MINIPROGRAM_CLOUD_AUTH_RETURN_URL:}
