# 通用配置（任意 profile 都生效）。
# profile 约定：
#   application.yaml        公共配置 + 本机默认可跑通的默认值
#   application-dev.yaml    开发环境差异（profile=dev）
#   application-local.yaml  个人密钥/口令，已 gitignore，禁止入库（profile=local）
# 没显式指定 profile 时（IDE 直接 Run、java -jar 不带参数）默认激活 dev,local；
# 生产用 --spring.profiles.active=prod 显式覆盖即可。
#
# ⚠️ 「开箱即用」有一个前提：token.secret 引用的 ${OPS_TOKEN_SECRET} 没有默认值，
#    缺了它连本地都起不来（PlaceholderResolutionException）。dev profile显式导入.env，
#    IDE工作目录应为本后端根目录；也可注入环境变量或写application-local.yaml。
#    其他profile由部署环境提供私密配置，见README.md。
wechat:
  login:
    mode: ${WECHAT_LOGIN_MODE:auto}
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}

spring:
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_SMTP_TIMEOUT:8000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:8000}
          quitwait: false
          ssl:
            enable: ${MAIL_SSL_ENABLED:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:true}
            required: ${MAIL_STARTTLS_REQUIRED:true}
  application:
    name: GlucoPilot Backend
  messages:
    basename: i18n/messages
  profiles:
    default: dev,local

  datasource:
    # 开发、测试和生产均连接团队统一部署的 MySQL；禁止在代码中写入服务器地址或密码。
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:sugar_health}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=${DB_SSL_ENABLED:false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      # Redis 必须由远程环境部署；本服务只通过环境变量连接，不在 compose 中创建临时数据容器。
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: ${REDIS_TIMEOUT:3s}

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 空库按顺序执行所有迁移；存量库必须确认历史版本，禁止自动猜测 baseline。
    baseline-on-migrate: false
    baseline-version: 3
  mvc:
    async:
      # SSE 流式补全（接口 2.25）的异步请求超时。
      # 2.25 改为返回 Flux 之后，超时不再由代码里的 new SseEmitter(timeout) 决定，而是走这个属性；
      # 不配置则落到容器默认值（Tomcat 通常 30s），等于把原来的 60s 悄悄改小。
      request-timeout: 60s
  ai:
    # 显式声明生效的聊天 provider。
    # 原因：各 provider 的自动装配条件都是
    # @ConditionalOnProperty(name="spring.ai.model.chat", havingValue="<provider>", matchIfMissing=true)，
    # 引入第二个 provider（如接入多模态）后若不显式指定，两者会争抢同一个 ChatModel Bean。
    model:
      chat: deepseek
    deepseek:
      api-key: ${AI_DEEPSEEK_API_KEY:${deepseek.apiKey:}}
      chat:
        # 官方枚举名（DeepSeekApi.ChatModel.DEEPSEEK_V4_FLASH = "deepseek-v4-flash"）。
        # 此前用的是不在枚举内的 "deepseek-flash"，实测可通但不规范，2026-09-23 统一为官方名。
        model: deepseek-v4-flash
        # deepseek-v4-flash 是推理模型：默认会先输出一大段思维链。
        # 实测同一问题：默认 7737ms / 426 tokens，关掉后 2293ms / 51 tokens，正文质量无肉眼差异。
        # 需要推理能力的场景（饮食分析、血糖识别）由 ai.scenes.<scene>.thinking 按场景单独开启。
        thinking:
          type: disabled
        # 兜底：思维链会吃光 max_tokens，设太小会出现 content 为空 + finish_reason=length
        max-tokens: 2048
    # 模型调用的自动重试（DeepSeekChatModel 内部持有 RetryTemplate，真的会重试）。
    # 默认值 max-attempts=10、backoff 初始 2s × 5 倍，与本模块 60s 的 SSE 超时叠加后，
    # 上游 5xx 时用户会长时间「正在思考」然后一次性拿到 error。这里显式收紧。
    retry:
      max-attempts: 3
      on-client-errors: false
      backoff:
        initial-interval: 1s
        multiplier: 2
    tools:
      limits:
        # 工具调用护栏：超过上限直接抛异常，避免模型陷入反复调用的死循环（当前未注册工具，先立好规矩）
        max-total-tool-calls: 8
        on-limit-exceeded: throw

server:
  port: 8080

# MyBatis-Plus：逻辑删除与下划线映射
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.threadfit.glucopilot: INFO
    com.baomidou.mybatisplus: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info


# ---------------------------------------------------------------------------
# AI 模块业务编排（前缀 ai）
# 与 spring.ai.* 的分工：spring.ai.* 管 provider 与框架行为；ai.* 管本项目的
# 场景 → 提示词/参数、记忆窗口、医疗安全词、工具白名单。
#
# 场景是 AI 模块的组织单位（见 SceneCode）：对话 / 对话内图片 / 饮食分析 / 血糖识别。
# 场景里 model-code、temperature、max-tokens、thinking 都是**可选覆盖**，
# 不写就继承上面的 spring.ai.deepseek.chat.* ，避免同一份参数维护两处。
# ---------------------------------------------------------------------------
ai:
  # 会话生命周期（接口 5.3 列表 / 5.4 删除 / 2.23 新建）
  chat:
    # 惰性归档阈值（天）：拉列表时把"进行中但太久没消息"的会话置为 0 归档，0 = 关闭。
    # 归档后该用户下次 /current 会新建会话，而不是接着老会话说话。
    archive-idle-days: 30
    # 会话列表每页上限，防止前端传超大 pageSize
    max-page-size: 50

  # 会话记忆窗口：送入模型的最近原文消息条数。
  # 注意：chat_session.window_msg_count 这一列已在 V21 标注废弃——读取侧只认这里的配置，
  # 不读那个列（避免出现"看起来能按会话调窗口、实际不生效"的误导）。
  #
  # ② 期（2026-10-16）起改为**按 token 预算**裁剪：
  #   实测一轮几乎空的对话（系统提示词 1651 字 + 6 个工具定义）就已经 5012 prompt tokens，
  #   而单条助手回复上限 20000 字、回放时不做逐条截断——"20 条"能装的内容量可以差两个数量级。
  memory:
    # 主判据：一轮 prompt 允许的总 token（含系统提示词与工具定义）。保守取值，它是安全阀不是目标值
    max-prompt-tokens: 4096
    # 无论预算多紧都至少保留这么多条最近历史（保连贯性，宁可超一点预算）
    keep-recent-messages: 6
    # 条数上限（降级为兜底：与 token 预算取小，防估算器被极短消息带偏后一次塞进几百条）
    window-messages: 20
    # 仓库一次最多捞多少条可回放消息（防御性上限）
    max-fetch: 200
    # 滚动摘要：长度上限、单次输入上限（字符）与输出 token 上限
    summary-max-chars: 800
    # 输入上限从 6000 降到 3000 是实测结论：6000 字摘要在该通道上会读超时（ReadTimeoutException），
    # 任务失败 → 摘要一直建不起来；摘要对"少一点原文"并不敏感
    summary-input-max-chars: 3000
    # 摘要正文只有几百字，封顶可杜绝"模型长篇发挥"拖长生成时间
    summary-max-tokens: 600
    # 工具结果回放（B3 后半）：是否把最近工具调用的结果摘要注入上下文，以及条数/字符上限
    tool-replay-enabled: true
    tool-replay-max-items: 3
    tool-digest-max-chars: 512

  # 医疗安全硬拦截：命中敏感词的请求不会发给模型，直接返回固定话术。
  # 提示词里的合规约束是软约束（模型可能不遵守），这里是硬约束。
  # 词表保持聚焦：不要放单字「药」，否则「二甲双胍能吃吗」这类正常科普问题也会被拦掉。
  guard:
    enabled: true
    sensitive-words:
      - 吃几片
      - 吃几粒
      - 剂量
      - 加量
      - 减量
      - 停药
      - 换药
      - 开药
      - 胰岛素用量
      - 调整用药
    # failure-response 留空则使用代码内置话术（引导就医 + 免责声明）

  # 工具白名单：只注册显式登记的工具，绝不做包扫描（见 AiToolRegistry / AiToolConfig）。
  # 名字必须与 @Tool(name=...) 完全一致；配了名字却没有对应 Bean 会在启动时 WARN。
  # 需要临时关闭全部工具时把 allow-list 置空即可（allow-list: []）。
  # ⚠️ 工具越多，模型选择越容易出错：新增前先想清楚能不能并进已有工具的返回里。
  tools:
    allow-list:
      - query_glucose_range
      - get_health_profile
      - get_daily_checkin
      - get_month_stats
      - query_meal_records
      - lookup_food_nutrition

  # ---------------------------------------------------------------------------
  # 提示词后台化（接口 4.11~4.13）：后台改提示词时执行的**阻断式**校验参数。
  # 提示词正文与版本在 ai_prompt_template 表；classpath 的 prompts/**/*.md 只在
  # "库里没有启用版本"或"库表那一版校验不通过"时兜底（行为与引入后台前一致）。
  # ---------------------------------------------------------------------------
  prompt:
    # 正文长度下限（字符）：误清空/误粘贴成一句话时直接拒绝保存
    min-length: 50
    # 需要安全关键词校验的场景（configKey）：对话场景面向用户，必须留专业就医指引
    safety-scenes:
      - chat
    # 必含安全关键词（命中任意一个即可），仅对 safety-scenes 生效
    safety-keywords:
      - 就医
      - 医院
      - 医生
      - 诊断

  # ---------------------------------------------------------------------------
  # 视觉（多模态）provider：阿里云百炼 qwen-vl，走 OpenAI 兼容协议（接口 2.24 msgType=2）。
  # enabled=false 时视觉场景继续抛业务异常，**绝不回落到文本模型**。
  # 凭据只放 application-local.yaml（已 gitignore）或环境变量，禁止写进本文件。
  # 注意：这里不是 spring.ai.openai.* —— 本模块刻意不引该 starter，
  # 写在那里不会有任何自动装配去读（详见 AIProperties.VisionProperties 注释）。
  # ---------------------------------------------------------------------------
  # 短语音转文字：仅返回待确认草稿，不自动发送聊天消息。
  # api-key 缺省时在服务内复用 ai.vision.api-key；密钥只放环境变量或本地配置。
  speech:
    enabled: true
    api-key: ${AI_SPEECH_API_KEY:}
    base-url: ${AI_SPEECH_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${AI_SPEECH_MODEL:qwen3-asr-flash}

  vision:
    # 刻意写字面量 false，不写成 ${AI_VISION_ENABLED:false}：
    # 类型化属性（boolean / int）拿到未解析的 ${...} 字面量会直接绑定失败，
    # 而 AiPropertiesBindingTest 用的正是「不解析占位符」的原始 YAML 加载器。
    # 需要开启时用环境变量 AI_VISION_ENABLED=true —— 环境变量优先级高于本文件，
    # 由 relaxed binding 映射到 ai.vision.enabled，@ConditionalOnProperty 也读得到。
    enabled: false
    base-url: ${AI_VISION_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${AI_VISION_API_KEY:}
    model: ${AI_VISION_MODEL:qwen3-vl-plus}
    max-tokens: 512
    temperature: 0.2
    # 单张图片原始字节上限（5MB）：超限直接拒绝，避免把超大图塞进 base64 请求
    max-image-bytes: 5242880
    timeout-seconds: 60

  meal:
    model: ${AI_MEAL_MODEL:qwen3-vl-plus}
    max-tokens: 2048

  # 通道级配置的统一视图：业务代码只读这一份（AiChannelProperties），两个通道形状完全相同。
  # 刻意「不改前缀、只加视图」：spring.ai.deepseek.* 仍由 starter 消费、ai.vision.* 仍由
  # AIProperties.VisionProperties 消费，这里用占位符把它们投影成同一形状，避免为了统一而
  # 把文本通道搬出 starter（那会丢掉自动装配的 RetryTemplate 与观测）。
  # 超时只作用于非流式调用（连通性测试、审核、摘要、记忆抽取）；SSE 流式不设读超时。
  channels:
    text:
      base-url: ${spring.ai.deepseek.base-url:https://api.deepseek.com}
      api-key: ${spring.ai.deepseek.api-key:}
      model: ${spring.ai.deepseek.chat.model:}
      temperature: ${spring.ai.deepseek.chat.temperature:}
      max-tokens: ${spring.ai.deepseek.chat.max-tokens:}
      timeout-seconds: ${AI_TEXT_TIMEOUT_SECONDS:60}
      connect-timeout-seconds: ${AI_TEXT_CONNECT_TIMEOUT_SECONDS:10}
    vision:
      base-url: ${ai.vision.base-url:}
      api-key: ${ai.vision.api-key:}
      model: ${ai.vision.model:}
      temperature: ${ai.vision.temperature:}
      max-tokens: ${ai.vision.max-tokens:}
      timeout-seconds: ${ai.vision.timeout-seconds:60}
      connect-timeout-seconds: ${AI_VISION_CONNECT_TIMEOUT_SECONDS:10}

  scenes:
    # 纯文本对话（接口 2.23 / 2.24 / 2.25）：当前唯一已实现的场景
    chat:
      prompt: prompts/chat/system.md
      version: v1

    # 对话内发图片（接口 2.24 msgType=2）的**阶段 1**：视觉模型看图，产出一段客观描述。
    # 阶段 2（组织回答）复用下面的 chat 场景——它本质就是一次普通对话，因此本场景
    # 只持有「看图描述」这一份提示词，不需要第二阶段的提示词，SceneCode 也无须新增场景。
    # 提示词刻意要求「只描述、不回答」：它的产物是中间产物，既进阶段 2 的上下文，
    # 也会回填 chat_message.media_caption 进入会话记忆。
    chat-image:
      prompt: prompts/chat-image/analyze.md
      version: v1

    # 饮食分析 / 拍照估糖（接口 2.20）：需要视觉模型；估算营养与血糖影响属于推理任务。
    # 注意：这里**不能**写 thinking —— 视觉通道走 OpenAI 兼容协议，没有这个入参，
    # 写了也不会发出去（启动时 SceneModelResolver.warnAboutIgnoredVisionThinking 会告警）。
    meal-analysis:
      prompt: prompts/meal-analysis/system.md
      version: v1
      variables:
        - foodText
      temperature: 0.2

    # 血糖仪读数识别（接口 2.21 / 2.22）：需要视觉模型；要求稳定不发挥，温度取低
    ocr-glucose:
      prompt: prompts/ocr-glucose/system.md
      version: v1
      temperature: 0

    # 会话滚动摘要（② 期）：把超出记忆窗口的旧对话压缩成事实摘要（产物是内部上下文，不给用户看）。
    # 温度取低：它要稳定复述而不是发挥；模型可单独在后台绑一个更便宜的（ai_scene_config）。
    summary:
      prompt: prompts/summary/compress.md
      version: v1
      temperature: 0.1

    # 长期记忆抽取（③ 期）：从对话里挑出值得跨会话记住的用户事实，输出 JSON（不给用户看）。
    # 温度取低：要稳定抽取而不是发挥；模型可在后台单独绑一个更便宜的。
    memory:
      prompt: prompts/memory/extract.md
      version: v1
      temperature: 0.1

    # 社区内容审核（社区 AI 审核一期）：文章初审与评论审核，输出判定 + 类别 + 严重度。
    # 温度取 0：判定要稳定；模型可在后台单独绑一个更便宜更快的（分类任务不需要推理大模型）。
    # 提示词正文**禁止出现花括号/方括号**（ST 模板会当成变量表达式，V22/V23/V27 三次教训），
    # 输出格式因此用「字段清单」描述。
    moderation:
      prompt: prompts/moderation/system.md
      version: v1
      temperature: 0
      # 审核结论只有几行字，封顶可杜绝"模型长篇发挥"拖延时延与成本
      max-tokens: 300
      # 关掉思维链：分类任务不需要推理链，开了只会让首 token 更慢（摘要场景已踩过读超时）
      thinking: false


glucopilot:
  mail:
    from: ${MAIL_FROM:}

# 账号注销异步清理 worker（方案 §6.4）
# enabled=false 时不做任何清理：只影响后台执行，C 端提交注销仍然生效并立即失效会话
account:
  cancellation:
    enabled: ${ACCOUNT_CANCELLATION_ENABLED:true}
    initial-delay: ${ACCOUNT_CANCELLATION_INITIAL_DELAY:20000}
    poll-delay: ${ACCOUNT_CANCELLATION_POLL_DELAY:30000}

# Official RuoYi framework settings; secrets supplied by deployment environment.
ruoyi:
  name: GlucoPilot
  version: 3.9.2
  copyrightYear: 2026
  profile: ${RUOYI_UPLOAD_PATH:/app/uploads}
  addressEnabled: false
  captchaType: math
user:
  password:
    maxRetryCount: 5
    lockTime: 10
token:
  header: Authorization
  secret: ${OPS_TOKEN_SECRET}
  expireTime: 480
mybatis:
  typeAliasesPackage: com.ruoyi.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml
xss:
  enabled: false
  excludes: /admin/v1/ruoyi/notices
  urlPatterns: /admin/v1/*
referer:
  enabled: false
  allowed-domains: localhost
gen:
  author: GlucoPilot
  packageName: com.threadfit.glucopilot.generated
  autoRemovePre: false
  tablePrefix: gp_
  allowOverwrite: false
