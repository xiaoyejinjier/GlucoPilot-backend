# 通用配置（任意 profile 都生效）。
# profile 约定：
#   application.yaml        公共配置 + 本机默认可跑通的默认值
#   application-dev.yaml    开发环境差异（profile=dev）
#   application-local.yaml  个人密钥/口令，已 gitignore，禁止入库（profile=local）
# 没显式指定 profile 时（IDE 直接 Run、java -jar 不带参数）默认激活 dev,local，
# 保证开箱即用；生产用 --spring.profiles.active=prod 显式覆盖即可。
spring:
  application:
    name: GlucoPilot Backend
  profiles:
    default: dev,local

  datasource:
    # 开发、测试和生产均连接团队统一部署的 MySQL；禁止在代码中写入服务器地址或密码。
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:sugar_health}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=${DB_SSL_ENABLED:false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      # Redis 必须由远程环境部署；本服务只通过环境变量连接，不在 compose 中创建临时数据容器。
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: ${REDIS_TIMEOUT:3s}

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 空库：执行 V1→V3；已有表且无 flyway_schema_history：自动 baseline 到 3，避免重复建表/插种子
    baseline-on-migrate: true
    baseline-version: 3
  ai:
    deepseek:
      api-key: ${deepseek.apiKey}
      chat:
        model: deepseek-flash
        # deepseek-flash 是推理模型：默认会先输出一大段思维链。
        # 实测同一问题：默认 7737ms / 426 tokens，关掉后 2293ms / 51 tokens，正文质量无肉眼差异。
        # 需要推理能力的场景（饮食分析、血糖建议）后续按请求用 ChatOptions 单独开启。
        thinking:
          type: disabled
        # 兜底：思维链会吃光 max_tokens，设太小会出现 content 为空 + finish_reason=length
        max-tokens: 2048

server:
  port: 8080

# MyBatis-Plus：逻辑删除与下划线映射
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.threadfit.glucopilot: INFO
    com.baomidou.mybatisplus: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info


ai:
  prompts:
    agent-prompts:
      agent-system-file: "promotes/agent/health_agent_system.md"

